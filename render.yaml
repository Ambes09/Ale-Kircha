# ============================================================
# RENDER DEPLOYMENT - FREE TIER (API + Database Only)
# ============================================================

services:
  # ----------------------------------------------------------
  # API Service (Web) - Main Service
  # ----------------------------------------------------------
  - type: web
    name: ale-kircha-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ale-kircha-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CUSTOMER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ale-kircha.vercel.app
      - key: TELEGRAM_MODE
        value: webhook
      - key: PAYMENT_ADVICE_MAX_SIZE
        value: "5242880"
      - key: DEFAULT_PAYMENT_DEADLINE_MINUTES
        value: "30"
      - key: API_URL
        fromService:
          name: ale-kircha-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

# ----------------------------------------------------------
# PostgreSQL Database (Free)
# ----------------------------------------------------------
databases:
  - name: ale-kircha-db
    databaseName: ale_kircha
    user: ale
    plan: free
