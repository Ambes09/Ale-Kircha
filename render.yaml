services:
  - type: web
    name: ale-kircha-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: |
      npm install
      npx prisma@5.22.0 generate
      npx prisma@5.22.0 db push --accept-data-loss
      node prisma/seed.js
    startCommand: node --import tsx src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: CUSTOMER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: PAYMENT_ADVICE_MAX_SIZE
        value: "5242880"
      - key: DEFAULT_PAYMENT_DEADLINE_MINUTES
        value: "30"
      - key: API_URL
        sync: false
      - key: APP_URL
        sync: false

  - type: worker
    name: ale-kircha-customer-bot
    runtime: node
    plan: free
    rootDir: apps/customer-bot
    buildCommand: npm install && npm run build
    startCommand: node dist/bot.js
    envVars:
      - key: CUSTOMER_BOT_TOKEN
        sync: false
      - key: API_URL
        sync: false

  - type: worker
    name: ale-kircha-admin-bot
    runtime: node
    plan: free
    rootDir: apps/admin-bot
    buildCommand: npm install && npm run build
    startCommand: node dist/bot.js
    envVars:
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: API_URL
        sync: false
